name: Build SharpRDP

on:
  push:
    branches: [ master ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 自动配置MSBuild（无需手动下载）
        uses: microsoft/setup-msbuild@v2  # 官方动作，自动适配合法依赖源

      - name: 还原NuGet包
        run: nuget restore SharpRDP/SharpRDP.sln

      - name: 编译项目（使用正确的平台配置）
        run: msbuild SharpRDP/SharpRDP.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: SharpRDP-Release
          path: '**/bin/Release/**/*'
